name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hareket tanımları çözülüyor ve tüm içerikleri kapsıyor mu?
        run: python3 tools/lottie_gen/generate.py --check-content --out "$RUNNER_TEMP/lottie_preview"

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri (çekirdek + uygulama, Robolectric)
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Lint (güvenlik ve doğruluk denetimleri)
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Debug ve release (R8) APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-ve-lint-raporlari
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
            core/build/reports/tests/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: fightedu-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fightedu-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
