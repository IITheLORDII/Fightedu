name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lottie animasyonları güncel mi?
        run: |
          python3 tools/lottie_gen/generate.py --check-content
          git diff --exit-code -- app/src/main/assets/lottie

      - uses: gradle/actions/setup-gradle@v4

      - name: Testler ve debug APK
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fightedu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
