name: Koç sesleri (Chatterbox, ticari serbest)

# Sesli koçun cümlelerini Resemble AI Chatterbox Multilingual (MIT lisansı) ile Türkçe kaydeder.
# mode=samples: yalnız örnek cümleler (tools/voice/samples). mode=full: tüm cümleler, paralel parçalarla;
# her klip faster-whisper ile yazıya dökülüp metinle karşılaştırılır, bozuk çıkanlar yeniden üretilir.
# mode=audit: kayıtlı klipleri yeniden dinler; bozuk/tekrarlı olanları yeni tohumlarla kaydeder (yalnız onlar
# değişir). İkisi de tools/voice/qa_report.md raporunu yazar.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "samples ya da full"
        type: choice
        options: [samples, full, audit]
        default: samples
      voice:
        description: "builtin (Chatterbox'ın hazır sesi) ya da depodaki referans kayıt yolu (ör. tools/voice/reference/koc.wav)"
        default: builtin
      shards:
        description: "full/audit modda paralel iş sayısı"
        default: "8"

permissions:
  contents: write

concurrency: voice

env:
  VOICE: ${{ inputs.voice }}
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.s.outputs.list }}
    steps:
      - id: s
        env:
          N: ${{ inputs.shards }}
        run: python3 -c "import json,os; n=max(1,min(20,int(os.environ['N']))); print('list='+json.dumps(list(range(n))))" >> "$GITHUB_OUTPUT"

  samples:
    if: inputs.mode == 'samples'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: chatterbox-0.1.7-v1
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7 faster-whisper==1.2.1
      - name: Örnek cümleler
        run: python3 tools/voice/synthesize.py --engine chatterbox --voice "$VOICE" --samples
      - name: Depoya ekle
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/voice/samples
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -q -m "Koç sesi örnekleri: Chatterbox ($VOICE)" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01FceEYgLZqAF66iDC6JL2ut"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 5))
          done

  shard:
    if: inputs.mode != 'samples'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
          key: chatterbox-0.1.7-v1
      - name: Araçlar
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q chatterbox-tts==0.1.7 faster-whisper==1.2.1
      - name: Parça ${{ matrix.shard }} / ${{ inputs.shards }}
        env:
          SHARD: ${{ matrix.shard }}/${{ inputs.shards }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = audit ]; then extra=--audit; else extra=; fi
          python3 tools/voice/synthesize.py --engine chatterbox --voice "$VOICE" --shard "$SHARD" --out shard_out $extra
      - uses: actions/upload-artifact@v4
        with:
          name: clips-${{ matrix.shard }}
          path: shard_out
          retention-days: 3

  finalize:
    if: inputs.mode != 'samples'
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Araçlar
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          path: shard_out
          merge-multiple: true
      - name: Klipleri yerleştir ve doğrula
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 tools/voice/synthesize.py --report shard_out
          mkdir -p app/src/main/assets/voice/clips shard_out
          # full: tüm klipler yenilenir; audit: yalnız yeniden kaydedilenler üzerine yazılır
          if [ "$MODE" = full ]; then rm -f app/src/main/assets/voice/clips/*.ogg; fi
          find shard_out -maxdepth 1 -name '*.ogg' -exec cp {} app/src/main/assets/voice/clips/ \;
          python3 tools/voice/synthesize.py --engine chatterbox --voice "$VOICE" --finalize
          python3 tools/voice/make_voice.py
      - name: Depoya ekle
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/assets/voice tools/voice/qa_report.md
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          if [ "$MODE" = audit ]; then
            title="Koç sesleri: ASR denetimi, bozuk klipler yeniden kaydedildi ($VOICE)"
            body="Kayıtlı klipler faster-whisper ile yeniden dinlendi; eşiği aşan ya da tekrarlı olanlar yeni tohumlarla kaydedildi, daha iyi çıkanlar yerine kondu. Rapor: tools/voice/qa_report.md."
          else
            title="Koç sesleri: Chatterbox (MIT, ticari serbest) ile yeniden kaydedildi ($VOICE)"
            body="Rauntlara özel tüm cümleler Chatterbox Multilingual ile Türkçe kaydedildi; her klip ASR ile denetlendi, ses planları ölçülen sürelerle yeniden zamanlandı."
          fi
          git commit -q -m "$title" -m "$body" \
            -m "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_01FceEYgLZqAF66iDC6JL2ut"
          for i in 1 2 3; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && break
            sleep $((i * 5))
          done
